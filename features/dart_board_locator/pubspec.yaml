name: dart_board_locator
description: Locator feature for Dart Board, provides a service locator pattern for dependency injection
homepage: https://dart-board.io
issue_tracker: https://github.com/ahammer/dart_board/issues
repository: https://github.com/ahammer/dart_board

version: 0.9.12

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:  
  flutter:
    sdk: flutter    
  dart_board_core: ^0.9.17
  dart_board_widgets: ^1.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  module:
    androidX: true
    androidPackage: com.example.dart_board_redux
    iosBundleIdentifier: com.example.dartBoardRedux
