name: dart_board_core
description: Feature Framework for Flutter. Provides a kernel that allows feature encapsulation, isolation and integration.
homepage: https://dart-board.io
issue_tracker: https://github.com/ahammer/dart_board/issues
repository: https://github.com/ahammer/dart_board
version: 0.9.17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  logging: ^1.2.0
  intl: ^0.18.1
  dart_board_widgets: ^1.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter  

flutter:
  uses-material-design: true
  module:
    androidX: true
    androidPackage: io.dartboard.core
    iosBundleIdentifier: io.dartboard.core
